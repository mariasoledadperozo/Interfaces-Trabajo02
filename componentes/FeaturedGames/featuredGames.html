<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

         <!-- CSS de Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        
         <!-- CSS propio -->
        <link href="css/featuredGames.css" rel="stylesheet">

    </head>

    <body>
        <main role="main" class="mainStyle">

            <div class="homePageBodyStyle">

                <div class="container1">

                    <section class="featuredGamesSectionStyle">

                        <div class="featured-header d-flex justify-content-between align-items-center mb-3">

                            <h3 class="featured-title">

                                <a href="https://www.rockstargames.com/games" class="featured-link" target="_blank">Featured Games</a>

                            </h3>

                        </div>

                            <!-- GTA VI como banner grande -->
                            <div class="hero" aria-hidden="false" role="img" aria-label="GTA VI - Banner">
                                
                                <a href="https://www.rockstargames.com/VI" class="d-block" target="_blank">
                                    <img src="img/GTAVI.jpg" alt="GTA VI banner">
                                </a>

                            </div>

                            <!-- GRID de mini posters -->
                            <div class="row justify-content-center g-4">

                                <div class="col-6 col-md-3 game-card">

                                    <a href=https://www.rockstargames.com/gta-v" class="d-block" target="_blank">

                                        <img src="img/GTAV.jpg" alt="GTA V" class="img-fluid shadow">

                                    </a>

                                </div>

                                <div class="col-6 col-md-3 game-card">

                                    <a href="https://www.rockstargames.com/gta-online" class="d-block" target="_blank">

                                        <img src="img/GTAonline.jpg" alt="GTA Online" class="img-fluid shadow">

                                    </a>

                                </div>

                                <div class="col-6 col-md-3 game-card">

                                    <a href="https://www.rockstargames.com/reddeadredemption2" class="d-block" target="_blank">

                                        <img src="img/readDeadRedemption2.jpg" alt="Read Dead Redemption 2" class="img-fluid shadow">

                                    </a>

                                </div>

                                <div class="col-6 col-md-3 game-card">

                                    <a href="https://www.rockstargames.com/reddeadredemption" class="d-block" target="_blank">

                                        <img src="img/readDeadRedemption.jpg" alt="Read Dead Redemption" class="img-fluid shadow">

                                    </a>

                                </div>

                            </div>

                            <!-- BOTÓN VIEW MORE -->
                            <div class="text-center mt-4">

                                    <a href="https://www.rockstargames.com/games" class="view-more-btn" target="_blank">View More</a>

                            </div>

                        </div>

                    </section>
                
                </div>     
            
            </div>               
        
        </main>        
    
        <!-- JS de Bootstrap -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>   
</html>
