<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockstar Games</title>
  <link rel="shortcut icon" href="../../assets/Logo-Rockstar.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/header-styles.css">
</head>

<body>

  <header class="navbar bg-black text-white navbar-dark navbar-expand-lg sticky-top">
    <div class="container-fluid p-0 overflow-hidden special-align" style="width: 95%;">

      <!-- Barra superior con logo y botones -->
      <div class="d-flex justify-content-between align-items-center p-3 w-100 bg-black">
        <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <img src="img/logo-blanco-rockstar.svg" alt="Logo de Rockstar Games" class="mb-lg-6 ms-lg-5 my-lg-2 logo-size">
        <img src="img/persona.svg" alt="Icono de perfil" class="icon-size d-lg-none">
      </div>

      <!-- Menú colapsable: siempre visible en PC -->
      <div class="navbar-collapse collapse" id="navbarNavAltMarkup">

        <!-- Buscador -->
        <div class="position-relative flex-grow-1 px-lg-3 mb-3 mb-lg-0 w-70 overflow-hidden">
          <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-white"></i>
          <input type="search" class="form-control rounded-0 bg-dark border-0 text-white ps-5 pe-2 w-100 d-lg-none"
            placeholder="Search Rockstar Games..." aria-label="Search">
        </div>

        <ul class="navbar-nav">

          <!-- Games: solo visible en LG, alineado verticalmente -->
          <li class="nav-item d-none d-lg-flex align-items-center ps-4 ps-lg-3 pt-2 pb-2">
            <a class="nav-link active fs-normal text-white" href="#">Games</a>
            <img src="img/abrir-menu-flecha.svg" alt="flecha para abrir menu" class="arrow-svg-size">
          </li>

          <!-- Sección de juegos: móvil/tablet -->
          <li class="nav-item ps-4 pt-3 d-lg-none col-7 col-md-12">
            <div class="d-flex flex-row justify-content-between mb-3 col-9 col-md-11">
              <a class="nav-link active fs-normal text-white" href="#">Featured Games</a>
              <a class="nav-link active text-end fs-small d-flex align-items-center gap-1 text-white" href="#">
                VIEW ALL <img src="img/flecha.svg" alt="Flecha" class="svg-size">
              </a>
            </div>

            <div class="d-flex gap-3 flex-nowrap overflow-auto wrapper mb-3 col-9 col-md-12">
              <div class="border border-secondary rounded p-1 bg-black flex-shrink-0 w-fixed">
                <img src="img/GTAVI.jpg" class="rounded pic-size" alt="GTA VI">
              </div>
              <div class="border border-secondary rounded p-1 bg-black flex-shrink-0">
                <img src="img/GTAV.jpg" class="rounded pic-size" alt="GTA V">
              </div>
              <div class="border border-secondary rounded p-1 bg-black flex-shrink-0">
                <img src="img/GTAONLINE.jpg" class="rounded pic-size" alt="GTA Online">
              </div>
              <div class="border border-secondary rounded p-1 bg-black flex-shrink-0">
                <img src="img/RDR.jpg" class="rounded pic-size" alt="Red Dead Redemption">
              </div>
              <div class="border border-secondary rounded p-1 bg-black flex-shrink-0">
                <img src="img/RDR2.jpg" class="rounded pic-size" alt="Red Dead Redemption 2">
              </div>
            </div>
          </li>

          <!-- Links del menú: NewsWire, Videos, Downloads -->
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">NewsWire</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Videos</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Downloads</a>
          </li>

          <!-- STORE -->
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2 
                     d-lg-flex flex-lg-row justify-content-lg-start">
            <a class="nav-link active fs-normal text-white" href="#">Store</a>
            <svg xmlns="http://www.w3.org/2000/svg" width="0.75rem" height="0.75rem" fill="none" viewBox="0 0 16 16">
              <path fill="currentColor"
                d="M5.667 5.333a.667.667 0 1 1 0-1.333h5.666c.368 0 .667.298.667.667v5.666a.667.667 0 0 1-1.333 0V6.276l-5.529 5.529a.667.667 0 1 1-.943-.943l5.529-5.529z"
                fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
          </li>

          <!-- SUPPORT -->
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2 
                     d-lg-flex flex-lg-row justify-content-lg-start">
            <a class="nav-link active fs-normal text-white" href="#">Support</a>
            <svg xmlns="http://www.w3.org/2000/svg" width="0.75rem" height="0.75rem" fill="none" viewBox="0 0 16 16">
              <path fill="currentColor"
                d="M5.667 5.333a.667.667 0 1 1 0-1.333h5.666c.368 0 .667.298.667.667v5.666a.667.667 0 0 1-1.333 0V6.276l-5.529 5.529a.667.667 0 1 1-.943-.943l5.529-5.529z"
                fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
          </li>

          <!-- Get launcher button -->
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 overflow-hidden special-size-button">
            <button class="col-5 col-md-11 fs-custom bg-launcher border-0 text-uppercase fw-bold rounded py-3 py-lg-2 px-5 px-lg-4">
              Get launcher
            </button>
          </li>

          <li>
            <img src="img/circulo.svg" alt="Lupa" class="d-none d-lg-block">
          </li>

          <li>
            <img src="img/persona.svg" alt="Icono de perfil" class="icon-size d-none d-lg-block">
          </li>
        </ul>
      </div>
    </div>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
