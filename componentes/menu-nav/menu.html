<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockstar Games</title>
  <link rel="shortcut icon" href="../../assets/Logo-Rockstar.ico" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/header-styles.css">
</head>

<body>

  <header class="navbar navbar-dark bg-black navbar-expand-lg sticky-top">
    <div class="container-fluid d-flex align-items-center justify-content-around p-0 container-size">

      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center ms-lg-3" href="#">
        <img src="img/logo-blanco-rockstar.svg" alt="Logo de Rockstar Games" class="logo-size">
      </a>

      <!-- Menú central -->
      <div class="collapse navbar-collapse justify-content-center" id="navbarNavAltMarkup">
        <ul class="navbar-nav d-flex flex-row align-items-center gap-3 ">

          <li class="nav-item align-items-center ps-4 ps-lg-3 pt-2 pb-2 games-card">
            <a class="nav-link active fs-normal text-white games" href="#">Games</a>
            <img src="img/abrir-menu-flecha.svg" alt="flecha para abrir menu" class="arrow-svg-size">
            <div class="d-lg-flex dropdown-menu games-dropdown-menu justify-content-start p-5 border-0 line-games w-100 container-fluid flex-column align-items-start text-start col-lg-10">
              <div class="d-flex flex-row w-93 justify-content-between align-items-center">
                <a href="" class="nav-link active fs-normal text-white fs-3 pt-3 pb-4">Featured Games</a>
                <a class="nav-link active text-end fs-6 d-flex align-items-center gap-1 text-white" href="#">
                  VIEW ALL <img src="img/flecha.svg" alt="Flecha" class="svg-size">
                </a>
              </div>

              <div class="gap-3 w-98 flex-nowrap overflow-auto justify-content-start align-items-start d-flex flex-row">
                <div class="flex-shrink-0 game-card">
                  <img src="img/GTAVI.jpg" class="rounded line-img" alt="GTA VI">
                </div>
                <div class="flex-shrink-0 game-card">
                  <img src="img/GTAV.jpg" class="rounded line-img" alt="GTA V">
                </div>
                <div class="flex-shrink-0 game-card">
                  <img src="img/GTAONLINE.jpg" class="rounded line-img" alt="GTA Online">
                </div>
                <div class="flex-shrink-0 game-card">
                  <img src="img/RDR2.jpg" class="rounded line-img" alt="Red Dead Redemption 2">
                </div>
                <div class="flex-shrink-0 game-card">
                  <img src="img/RDR.jpg" class="rounded line-img" alt="Red Dead Redemption">
                </div>
              </div>
            </div>
          </li>

          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">NewsWire</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Videos</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Downloads</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Store</a>
          </li>
          <li class="nav-item ps-4 ps-lg-3 pt-2 pb-2 d-flex align-items-center gap-2">
            <a class="nav-link active fs-normal text-white" href="#">Support</a>
          </li>

        </ul>
      </div>

      <!-- Botones / iconos a la derecha -->
      <div class="d-none d-lg-flex align-items-center gap-3 me-lg-3 justify-content-around gap-4">
        <button class="fs-custom bg-launcher border-0 text-uppercase fw-bolder rounded text-nowrap py-1 px-1 button-launcher">
          Get launcher
        </button>
        <img src="img/circulo.svg" alt="Lupa" class="icon-search-size">
        <img src="img/persona.svg" alt="Icono de perfil" class="icon-size">
      </div>

      <!-- Botón hamburguesa móvil -->
      <button class="navbar-toggler d-lg-none me-2" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

    </div>
  </header>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="js/main.js"></script>
</body>

</html>
