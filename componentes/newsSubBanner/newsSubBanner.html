<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Email Subscribe Section</title>

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- CSS propio -->
        <link href="css/newSubBanner.css" rel="stylesheet">    
    </head>

    <body>
    <main>
        <section class="subscribe-section">
            <div class="subscribe-content">
                
                <!-- Logotipo -->
                <img src="img/logoRockstar.svg" alt="Rockstar Logo" class="subscribe-logo" />
                
                <!-- Título -->
                <h5 class="subscribe-title">Subscribe to the Rockstar Games Email List</h5>

                <!-- Texto -->
                <p class="subscribe-text">
                Sign up for our email newsletter to get info on game announcements and updates, 
                details on special events and offers, and more from Rockstar Games and our affiliates.
                </p>

                <!-- Botón -->
                <a href="https://signin.rockstargames.com/connect/authorize/rsg?returnUrl=/%3Fmarketing%3Dtrue&amp;lang=en-US&amp;newsletter=true" target="_blank">
                <button type="button" class="subscribe-btn">Subscribe Now</button>
                </a>

            </div>
        </section>
    </main>
    </body>
</html>
