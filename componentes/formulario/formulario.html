<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Formulario</title>

        <!-- Bootstrap 5 -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

        <!-- CSS propio -->
        <link href="css/formulario.css" rel="stylesheet" />
    </head>

    <body>
        <main>
            <section class="subscribe-section">
            <div class="subscribe-content text-center">

                <h2 class="subscribe-title">Subscribe to the Rockstar Games Email List</h2>

                <!-- Texto -->
                <p class="subscribe-text">
                Sign up for our email newsletter to get info on game announcements and updates,
                details on special events and offers, and more from Rockstar Games and our affiliates.
                </p>

                <form id="bsSubscribeForm" class="row g-3 justify-content-center" novalidate>
                <div class="col-12 col-md-10 col-lg-8">

                    <div class="mb-2">
                    <input type="text" class="form-control bg-ghost" id="bsName"
                            name="name" placeholder="Nombre" required maxlength="80" />
                    <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
                    </div>

                    <div class="mb-2">
                    <input type="email" class="form-control bg-ghost" id="bsEmail"
                            name="email" placeholder="Correo electrónico" required />
                    <div class="invalid-feedback">Por favor ingresa un correo válido.</div>
                    </div>

                    <div class="mb-3">
                    <textarea id="bsComment" name="comment" rows="4"
                                class="form-control bg-ghost rounded-3" placeholder="Comentario (opcional)"></textarea>
                    </div>

                    <div class="d-flex gap-2 justify-content-center">
                    <button type="submit" class="btn btn-ghost" id="bsSubmitBtn">Enviar</button>
                    <button type="button" class="btn btn-outline-ghost" id="bsCancelBtn">Cancelar</button>
                    </div>

                    <div class="mt-3 text-center">
                    <p id="bsFormMessage" class="mb-0 small" aria-live="polite"></p>
                    </div>
                </div>
                </form>
                <!-- /Formulario -->

            </div>
            </section>
        </main>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <!-- JS propio -->
        <script src="js/formulario.js"></script>
    </body>
</html>
